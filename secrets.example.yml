---
# Template for inventories/<env>/group_vars/vps/secrets.vault.yml. Never fill in this file:
#   ansible-vault create inventories/prod/group_vars/vps/secrets.vault.yml
# then paste these keys with real values.

# sudo password for admin (also used for the provider web console as a fallback).
vault_admin_password: "change-me-long-random-passphrase"
# Exactly 16 characters from [a-zA-Z0-9./]. Keeps the hash stable between runs.
vault_admin_password_salt: "Ab3dEf6hIj9kLm2n"

# Password for BasicAuth applications (user: traefik_basic_auth_user).
traefik_basic_auth_password: "change-me-too"

# --- Optional ------------------------------------------------------------------
# Environment of each application, written to /opt/apps/<app>/.env (root only).
# app_secrets:
#   monapp:
#     POSTGRES_USER: monapp
#     POSTGRES_DB: monapp
#     POSTGRES_PASSWORD: "..."

# Discord alerts (Server settings > Integrations > Webhooks).
# discord_webhook_infra: "https://discord.com/api/webhooks/..."
# discord_webhook_security: "https://discord.com/api/webhooks/..."

# Backups (backup_enabled: true). Keep restic_password outside this vault too.
# restic_password: "at-least-20-characters"
# restic_s3_access_key: "..."
# restic_s3_secret_key: "..."

# Read-only registry token for private images.
# registry_auths:
#   - { registry: ghcr.io, username: me, password: "..." }

# DNS-01 (acme_challenge: dns), e.g. OVH:
# acme_dns_env:
#   OVH_ENDPOINT: ovh-eu
#   OVH_APPLICATION_KEY: "..."
#   OVH_APPLICATION_SECRET: "..."
#   OVH_CONSUMER_KEY: "..."

# Cloudflare proxy (edge_proxy: cloudflare).
# cloudflare_firewall_token: "..."
# cloudflare_zone_id: "..."
