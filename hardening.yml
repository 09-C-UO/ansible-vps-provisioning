---
- name: Harden and prepare an Ubuntu application VPS
  hosts: vps
  become: true
  gather_facts: true

  vars:
    sshd_ports:
      - "{{ ssh_port }}"
    docker_architecture_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

  pre_tasks:
    - name: Verify the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] is version('22.04', '>=')
        fail_msg: This baseline supports Ubuntu 22.04 LTS or newer.

    - name: Refuse to run the lab against anything but a container
      ansible.builtin.assert:
        that:
          - host_is_container | bool
        fail_msg: >-
          lab_host is set but the target is not detected as a container
          ({{ ansible_facts['virtualization_type'] | default('unknown') }}).
          Stopping before kernel-wide settings reach the lab's host.
      when: lab_host | default(false) | bool

    - name: Verify the controller connected through the admin account
      ansible.builtin.assert:
        that:
          - ansible_user == admin_user
        fail_msg: Run bootstrap.yml first; the hardening playbook must connect as admin.

    - name: Verify admin sudo is not passwordless
      ansible.builtin.stat:
        path: /etc/sudoers.d/90-ansible-admin
      register: nopasswd_dropin
      failed_when: nopasswd_dropin.stat.exists

    - name: Verify Docker supports the VPS architecture
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in docker_architecture_map
        fail_msg: "Unsupported Docker architecture: {{ ansible_facts['architecture'] }}"
      when: install_docker | bool

  tasks:
    - name: Update the APT cache and install baseline security packages
      ansible.builtin.apt:
        name:
          - apparmor
          - apparmor-utils
          - auditd
          - audispd-plugins
          - ca-certificates
          - curl
          - fail2ban
          - gnupg
          - needrestart
          - sudo
          - systemd-timesyncd
          - ufw
          - unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Apply available package upgrades
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true
      when: apply_package_upgrades | bool

    - name: Keep deploy out of all privileged supplementary groups
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: ""
        append: false
        password_lock: true
        shell: /bin/bash

    - name: Create the application handoff directory
      ansible.builtin.file:
        path: "{{ application_root }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0750'

    - name: Ensure deploy has no sudoers drop-in
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ deploy_user }}"
        state: absent

    - name: Configure automatic APT runs
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Configure unattended security upgrade behavior
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/60ansible-security-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          Dpkg::Options {
             "--force-confdef";
             "--force-confold";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "{{ automatic_reboot | bool | lower }}";
          Unattended-Upgrade::Automatic-Reboot-Time "{{ automatic_reboot_time }}";

    # With socket activation (Ubuntu 24.04) /run/sshd may not exist yet, and
    # sshd -t refuses to validate without it.
    - name: Ensure the sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the managed SSH hardening configuration
      ansible.builtin.template:
        src: templates/sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
        owner: root
        group: root
        mode: '0644'
        validate: /usr/sbin/sshd -t -f %s
      register: sshd_hardening

    - name: Apply the SSH configuration
      ansible.builtin.include_tasks: tasks/sshd_apply.yml
      when: sshd_hardening.changed

    - name: Configure kernel and network hardening
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-ansible-hardening.conf
        reload: true
      # net.ipv4/net.ipv6 keys are per network namespace; every other key is
      # kernel-wide and would change the lab's host through a container.
      when: not host_is_container or item.key is match('net\.ipv[46]\.')
      loop_control:
        label: "{{ item.key }}"
      loop:
        - { key: fs.protected_hardlinks, value: '1' }
        - { key: fs.protected_symlinks, value: '1' }
        - { key: kernel.dmesg_restrict, value: '1' }
        - { key: kernel.kptr_restrict, value: '2' }
        - { key: kernel.randomize_va_space, value: '2' }
        - { key: kernel.yama.ptrace_scope, value: '1' }
        - { key: net.ipv4.conf.all.accept_redirects, value: '0' }
        - { key: net.ipv4.conf.default.accept_redirects, value: '0' }
        - { key: net.ipv4.conf.all.accept_source_route, value: '0' }
        - { key: net.ipv4.conf.default.accept_source_route, value: '0' }
        - { key: net.ipv4.conf.all.rp_filter, value: '2' }
        - { key: net.ipv4.conf.default.rp_filter, value: '2' }
        - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: '1' }
        - { key: net.ipv4.tcp_syncookies, value: '1' }
        - { key: net.ipv6.conf.all.accept_redirects, value: '0' }
        - { key: net.ipv6.conf.default.accept_redirects, value: '0' }
        # Hardening v2 (Lynis KRNL-6000). Deliberately NOT applied because they
        # break Docker: net.ipv4.conf.all.forwarding=0, kernel.modules_disabled=1.
        # kernel.perf_event_paranoid keeps Ubuntu's stricter default (4).
        - { key: dev.tty.ldisc_autoload, value: '0' }
        - { key: fs.protected_fifos, value: '2' }
        - { key: fs.protected_regular, value: '2' }
        - { key: fs.suid_dumpable, value: '0' }
        - { key: kernel.core_uses_pid, value: '1' }
        - { key: kernel.sysrq, value: '0' }
        - { key: kernel.unprivileged_bpf_disabled, value: '1' }
        - { key: net.core.bpf_jit_harden, value: '2' }
        - { key: net.ipv4.conf.all.log_martians, value: '1' }
        - { key: net.ipv4.conf.default.log_martians, value: '1' }
        - { key: net.ipv4.conf.all.send_redirects, value: '0' }
        - { key: net.ipv4.conf.default.send_redirects, value: '0' }
        - { key: net.ipv4.icmp_ignore_bogus_error_responses, value: '1' }

    - name: Disable rarely used network protocols with a history of kernel flaws
      ansible.builtin.copy:
        dest: /etc/modprobe.d/ansible-hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible (Lynis NETW-3200).
          blacklist dccp
          install dccp /bin/false
          blacklist sctp
          install sctp /bin/false
          blacklist rds
          install rds /bin/false
          blacklist tipc
          install tipc /bin/false

    - name: Disable core dumps for every user
      ansible.builtin.copy:
        dest: /etc/security/limits.d/60-ansible-no-core.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Managed by Ansible (Lynis KRNL-5820).
          * hard core 0
          * soft core 0

    - name: Make new files private to their owner and group by default
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^UMASK\s'
        line: "UMASK\t\t027"

    - name: Restrict the sudoers drop-in directory
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Install a legal warning banner
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          Authorized access only. All activity on this system is logged and monitored.
      loop:
        - /etc/issue
        - /etc/issue.net

    # auditd is useless without rules: record changes to identity, privilege,
    # SSH, firewall and Docker configuration, and every command run as root by
    # a logged-in human (sudo). Search with: sudo ausearch -k <key> -i
    # Every watched path must exist when the rules load (handler, end of play).
    - name: Install the audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-ansible-hardening.rules
        owner: root
        group: root
        mode: '0640'
        content: |
          ## Managed by Ansible.
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/sudoers -p wa -k privilege
          -w /etc/sudoers.d/ -p wa -k privilege
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
          -w /home/{{ admin_user }}/.ssh/ -p wa -k ssh_keys
          -w /home/{{ deploy_user }}/.ssh/ -p wa -k ssh_keys
          -w /etc/ufw/ -p wa -k firewall
          -w /etc/fail2ban/ -p wa -k firewall
          {% if install_docker | bool %}
          -w /etc/docker/ -p wa -k docker
          -w /usr/bin/docker -p x -k docker
          {% endif %}
          -w /etc/crontab -p wa -k cron
          -w /etc/cron.d/ -p wa -k cron
          -w /etc/systemd/system/ -p wa -k systemd
          -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules
          -a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=unset -k root_commands
      notify: Load audit rules

    - name: Ensure UFW manages IPv6 too
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: IPV6=yes
      notify: Reload UFW

    - name: Set the default inbound firewall policy
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Set the default outbound firewall policy
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH from configured trusted networks
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp
        from_ip: "{{ item }}"
        comment: Managed SSH access
      loop: "{{ ssh_allowed_cidrs }}"
      when: ssh_allowed_cidrs | length > 0

    - name: Allow rate-limited SSH globally when no trusted network is configured
      community.general.ufw:
        rule: limit
        port: "{{ ssh_port }}"
        proto: tcp
        comment: Managed SSH access
      when: ssh_allowed_cidrs | length == 0

    - name: Allow explicitly configured public TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
        comment: Managed public service
      loop: "{{ public_tcp_ports }}"

    # UFW applies its own sysctl file whenever it starts or reloads, after the
    # system's: its log_martians=0 would silently undo the setting above.
    - name: Keep UFW from turning martian logging back off
      ansible.builtin.lineinfile:
        path: /etc/ufw/sysctl.conf
        regexp: '^net/ipv4/conf/{{ item }}/log_martians='
        line: "net/ipv4/conf/{{ item }}/log_martians=1"
      loop:
        - all
        - default
      notify: Reload UFW

    - name: Enable UFW logging
      community.general.ufw:
        logging: low

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Configure Fail2ban for OpenSSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: '0644'
        content: |
          [sshd]
          enabled = true
          backend = systemd
          port = {{ ssh_port }}
          banaction = ufw
          maxretry = 5
          findtime = 10m
          bantime = 1h
          bantime.increment = true
          ignoreip = 127.0.0.1/8 ::1 {{ ssh_allowed_cidrs | join(' ') }}
      notify: Restart Fail2ban

    - name: Persist and cap the system journal
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: '2755'
      notify: Restart journald

    - name: Create the journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure persistent journal limits
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/60-ansible-hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Journal]
          Storage=persistent
          Compress=yes
          Seal=yes
          SystemMaxUse=500M
          RuntimeMaxUse=100M
          MaxRetentionSec=1month
      notify: Restart journald

    - name: Ensure baseline security services are enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      # auditd, AppArmor and the clock are kernel-wide: not managed from a container.
      when: not host_is_container or item in ['fail2ban', 'unattended-upgrades']
      loop:
        - apparmor
        - auditd
        - fail2ban
        - systemd-timesyncd
        - unattended-upgrades

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: install_docker | bool

    - name: Install Docker's official signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'
      when: install_docker | bool

    - name: Configure Docker's official APT source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts['distribution_release'] }}
          Components: stable
          Architectures: {{ docker_architecture_map[ansible_facts['architecture']] }}
          Signed-By: /etc/apt/keyrings/docker.asc
      when: install_docker | bool

    - name: Install Docker Engine without granting socket access to deploy
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: true
      when: install_docker | bool

    - name: Configure conservative Docker daemon defaults
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "live-restore": true,
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "no-new-privileges": true,
            "userland-proxy": false
          }
        validate: /usr/bin/dockerd --validate --config-file=%s
      when: install_docker | bool
      notify: Restart Docker

    - name: Ensure Docker is enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: install_docker | bool

    - name: Reassert that deploy has no Docker or sudo group access
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: ""
        append: false
      when: install_docker | bool

    - name: Validate the effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Verify Fail2ban is responsive
      ansible.builtin.command: /usr/bin/fail2ban-client ping
      register: fail2ban_ping
      changed_when: false
      failed_when: "'pong' not in fail2ban_ping.stdout | lower"

    - name: Verify deploy has no privileged group memberships
      ansible.builtin.command: "/usr/bin/id -nG {{ deploy_user }}"
      register: deploy_groups
      changed_when: false
      failed_when:
        - "'sudo' in deploy_groups.stdout.split() or 'docker' in deploy_groups.stdout.split()"

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: A reboot is required to finish applying security updates.
      when: reboot_required.stat.exists

  handlers:
    - name: Load audit rules
      ansible.builtin.command: /usr/sbin/augenrules --load
      changed_when: true
      when: not host_is_container

    - name: Reload UFW
      community.general.ufw:
        state: reloaded

    - name: Restart Fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Restart journald
      ansible.builtin.service:
        name: systemd-journald
        state: restarted

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
