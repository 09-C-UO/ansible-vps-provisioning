---
# Decoy secrets (honeytokens): files no legitimate process ever uses. Their
# content comes from canarytokens.org, which alerts by e-mail when someone uses
# them, from outside this server. Define in the vault, never in git:
#   canary_files:
#     - path: /root/.aws/credentials
#       content: |
#         [default]
#         aws_access_key_id = AKIA...
#         aws_secret_access_key = ...
canary_files: []
