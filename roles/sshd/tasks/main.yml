---
# Writes the managed sshd drop-in for the ports in sshd_ports, then makes sshd
# listen on them. Used by bootstrap.yml (port transition) and the hardening role.

# With socket activation (Ubuntu 24.04) /run/sshd may not exist yet, and
# sshd -t refuses to validate without it.
- name: Ensure the sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the managed SSH hardening configuration
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  register: sshd_hardening

- name: Validate the complete SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply the SSH configuration
  ansible.builtin.include_tasks: apply.yml
  when: sshd_hardening.changed
