---
# Ubuntu baseline: packages, accounts, SSH, kernel, audit, firewall, logs.
# Docker lives in its own role (roles/docker).

- name: Check the target before changing anything
  ansible.builtin.import_tasks: preflight.yml

- name: Install the baseline packages
  ansible.builtin.import_tasks: packages.yml

- name: Restrict the deploy account
  ansible.builtin.import_tasks: accounts.yml

- name: Configure automatic security updates
  ansible.builtin.import_tasks: updates.yml

- name: Harden SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Harden the kernel and the login defaults
  ansible.builtin.import_tasks: kernel.yml

- name: Configure auditd
  ansible.builtin.import_tasks: audit.yml

- name: Configure UFW
  ansible.builtin.import_tasks: firewall.yml

- name: Configure Fail2ban
  ansible.builtin.import_tasks: fail2ban.yml

- name: Configure journald
  ansible.builtin.import_tasks: journald.yml

- name: Enable the security services
  ansible.builtin.import_tasks: services.yml

- name: Verify the result
  ansible.builtin.import_tasks: verify.yml
