---
- name: Configure Fail2ban for OpenSSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      port = {{ ssh_port }}
      banaction = ufw
      maxretry = 5
      findtime = 10m
      bantime = 1h
      bantime.increment = true
      ignoreip = 127.0.0.1/8 ::1 {{ ssh_allowed_cidrs | join(' ') }}
  notify: Restart Fail2ban
